services:
  db:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb-lezeni
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=db
      - MONGODB_INITDB_ROOT_PASSWORD=password
    ports:
      - "27017:27017"
    volumes:
      - lezeni_db:/data/db
    restart:
        unless-stopped

  app:
    build: .
    container_name: nodejs-lezeni
    restart: unless-stopped
    environment:
      - DB_URI=mongodb://db:password@mongodb:27017/
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  lezeni_db:
